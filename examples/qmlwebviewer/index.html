<!DOCTYPE html>
<html>
  <head>
    <title>QML Web Viewer</title>
    <meta charset="UTF-8"/>

    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="theme-color" content="#FFFFFF"/>
    <meta name="application-name" content="QMLWebViewer"/>

    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />

    <style type="text/css">
    * {
        margin: 0;
    }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    #displayContainer {
        min-height: 100%;
        height: auto !important;
        height: 100%;
    }
    </style>

    <script src="https://code.jquery.com/jquery-1.11.2.min.js"></script>

    <script src="Viridity.js"></script>
    <script src="DataBridge.js"></script>
    <script src="DisplayRenderer.js"></script>

    <script type="text/javascript">
        $(document).ready(function() {
            var channel = new Viridity({ connectionMethod: ConnectionMethod.Auto });
            var display = $("#displayContainer").viridity(channel, "main");
            display.debugVerbosity = 2;
        });
    </script>
  </head>
  <body>
    <div id="displayContainer"></div>
  </body>
</html>
